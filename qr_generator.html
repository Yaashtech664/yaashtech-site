<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaashtech | Multi-Row Premium QR Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #000000; color: #a0aab2; }
        .focus-cyan:focus { border-color: #00dcff !important; box-shadow: 0 0 0 2px rgba(0, 220, 255, 0.2) !important; }
    </style>
</head>
<body class="font-sans min-h-screen pb-10 flex flex-col justify-between">

    <header class="bg-black border-b border-zinc-900 px-[5%] py-2.5 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <img class="w-[90px] h-[90px] object-contain" src="logo.png" alt="Yaashtech Logo">
            <div class="text-white text-[26px] font-bold tracking-[0.5px]">Yaash<span class="text-[#00dcff]">tech</span></div>
        </div>
        <nav class="flex gap-6 items-center">
            <a href="dashboard.html" class="text-white hover:text-[#00dcff] font-bold text-[15px] transition-colors">Dashboard Hub</a>
            <a href="qr_generator.html" class="text-[#00dcff] font-bold text-[15px] border-b-2 border-[#00dcff] pb-1">QR Generator</a>
            <a href="#" class="text-zinc-600 font-bold text-[15px] cursor-not-allowed opacity-40">📦 Logistics (Future)</a>
            <button onclick="logoutSession()" class="text-red-400 hover:text-red-500 font-bold text-[14px] ml-4 cursor-pointer">Lock & Exit</button>
        </nav>
    </header>

    <div class="max-w-7xl mx-auto mt-10 px-4 flex-1 w-full">
        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            
            <div class="xl:col-span-2 bg-zinc-950 rounded-2xl border border-zinc-900 p-6 space-y-6 shadow-xl h-fit">
                <div>
                    <h2 class="text-white font-bold text-base tracking-wide uppercase text-[#00dcff]">vCard Multi-Row Data Matrix</h2>
                    <p class="text-xs text-zinc-500 mt-1">Fill fields to compile a standalone high-capacity profile code.</p>
                </div>
                <hr class="border-zinc-900">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">👤 Full Name</label>
                        <input type="text" id="name" value="UDHAYAKUMAR S" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">💼 Job Title / Designation</label>
                        <input type="text" id="title" value="HEAD IT" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">🏢 Company Name</label>
                        <input type="text" id="company" value="BULLET LOGISTICS INDIA PRIVATE LIMITED" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">📞 Primary Mobile Number</label>
                        <input type="text" id="phone1" value="9080106508" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">📱 Alternative Mobile Number</label>
                        <input type="text" id="phone2" value="7502608869" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">✉️ Primary Email Address</label>
                        <input type="text" id="email1" value="udhayam1794@gmail.com" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">📧 Alternative Email Address</label>
                        <input type="text" id="email2" value="udhay@bulletlogistics.in" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">🌐 Website URL Name</label>
                        <input type="text" id="website" value="https://yaashtech.in" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">🗺️ Google Maps Share Link</label>
                        <input type="text" id="mapsLink" value="https://maps.app.goo.gl/fst2op" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">📍 Office Address Text</label>
                        <input type="text" id="address" value="Flat No S1, May Flower Apartment, Vgn Avenue, Kumananchavadi, Chennai" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs font-semibold text-zinc-400 mb-1">🧱 Pin Code</label>
                        <input type="text" id="pincode" value="600056" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2 text-sm focus:outline-none transition-all focus-cyan input-trigger">
                    </div>
                </div>
            </div>

            <div class="bg-zinc-950 rounded-2xl border border-zinc-900 p-6 flex flex-col items-center justify-center text-center shadow-xl min-h-[480px] h-fit">
                <span class="text-xs font-bold uppercase tracking-wider text-[#00dcff] mb-4">High-Capacity Instant Scan Frame</span>
                <div id="qrcode" class="bg-white p-4 rounded-xl shadow-md border border-zinc-200 inline-block"></div>
                <div class="mt-6 text-center w-full">
                    <p class="text-xs font-medium text-zinc-400 mb-2 uppercase tracking-wide">Data Encoded:</p>
                    <textarea id="rawPayload" readonly class="w-full text-xs font-mono bg-black border border-zinc-900 rounded-md p-2 h-20 resize-none focus:outline-none text-zinc-500"></textarea>
                </div>
                <div class="flex gap-3 w-full mt-4">
                    <button id="downloadBtn" class="flex-1 bg-[#00dcff] hover:bg-[#00b2cc] text-black font-bold text-sm py-2.5 px-4 rounded-lg transition-all flex items-center justify-center gap-2 cursor-pointer shadow-md">
                        📥 Download + Border
                    </button>
                    <button id="logRecordBtn" class="bg-zinc-900 hover:bg-zinc-800 text-white border border-zinc-800 font-bold text-sm py-2.5 px-4 rounded-lg transition-all cursor-pointer">
                        💾 Save to History
                    </button>
                </div>
            </div>

            <div class="bg-zinc-950 border border-zinc-900 p-6 flex flex-col shadow-xl max-h-[580px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-white font-bold text-md tracking-wide">📜 Active History Logs</h2>
                    <button id="clearHistoryBtn" class="text-xs text-red-400 hover:text-red-500 font-bold cursor-pointer transition-colors">Clear All</button>
                </div>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button id="exportDatabaseBtn" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 font-bold text-xs py-1.5 px-2 rounded-lg transition-all cursor-pointer">Export Logs</button>
                    <label class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 font-bold text-xs py-1.5 px-2 rounded-lg transition-all cursor-pointer text-center block">
                        Import Logs
                        <input type="file" id="importDatabaseFile" class="hidden" accept=".json">
                    </label>
                </div>
                <div id="historyLogList" class="space-y-3 overflow-y-auto flex-1 pr-1 text-left"></div>
            </div>

        </div>
    </div>

    <script src="qr_engine.js"></script>
    <script>
        if (localStorage.getItem("yaashtech_session") !== "authenticated_token_active") {
            window.location.href = "login.html";
        }
        function logoutSession() {
            localStorage.removeItem("yaashtech_session");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
