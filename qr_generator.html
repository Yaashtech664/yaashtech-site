<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card QR Code Generator</title>
    <!-- Load Tailwind CSS for clean, modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Load the QR Code library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen py-10 px-4">

    <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-slate-900 text-white p-6 text-center">
            <h1 class="text-2xl font-bold tracking-tight">Business Card QR Code Generator</h1>
            <p class="text-slate-400 text-sm mt-1">Dynamic real-time QR creation for Contact vCards and WhatsApp Links</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 p-6 md:p-8">
            
            <!-- Left Side: Inputs Form -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-750 mb-2">Select QR Code Type</label>
                    <select id="qrType" class="w-full bg-white border border-gray-300 rounded-lg p-2.5 shadow-xs focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                        <option value="vcard">Save Contact (Professional vCard)</option>
                        <option value="whatsapp">Direct WhatsApp Chat Link</option>
                    </select>
                </div>

                <hr class="border-gray-200">

                <!-- Dynamic Form Fields -->
                <div id="formFields" class="space-y-4">
                    <!-- JavaScript dynamically populates fields here -->
                </div>
            </div>

            <!-- Right Side: Live QR Output Box -->
            <div class="flex flex-col items-center justify-center bg-gray-50 rounded-xl p-6 border border-dashed border-gray-300 min-h-[400px]">
                <span class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-4">Live Preview Scan Test</span>
                
                <!-- Target container where the QR Code will render -->
                <div id="qrcode" class="bg-white p-4 rounded-xl shadow-md border border-gray-200 inline-block"></div>
                
                <div class="mt-6 text-center w-full max-w-sm">
                    <p id="qrStatusLabel" class="text-xs font-medium text-slate-500 mb-2 uppercase tracking-wide">Data Encoded:</p>
                    <textarea id="rawPayload" readonly class="w-full text-xs font-mono bg-gray-100 border border-gray-200 rounded-md p-2 h-24 resize-none focus:outline-none focus:ring-0 text-gray-600"></textarea>
                </div>
                
                <button id="downloadBtn" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm py-2 px-4 rounded-lg shadow-xs cursor-pointer transition-all flex items-center gap-2">
                    📥 Download QR Image
                </button>
            </div>

        </div>
    </div>

    <!-- External Script Engine Linking -->
    <script src="qr_engine.js"></script>
</body>
</html>
