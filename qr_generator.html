<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaashtech | Advanced Multi-Column QR Portal</title>
    <!-- Load Tailwind CSS for clean, modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Load the QR Code library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #a0aab2;
        }
        .focus-cyan:focus {
            border-color: #00dcff !important;
            box-shadow: 0 0 0 2px rgba(0, 220, 255, 0.2) !important;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #222222;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00dcff;
        }
    </style>
</head>
<body class="font-sans min-h-screen pb-10">

    <!-- Top Sticky Header Navigation Bar -->
    <header class="bg-black border-b border-zinc-900 px-[5%] py-2.5 flex flex-col md:flex-row justify-between items-center sticky top-0 z-50 gap-4 md:gap-0">
        <div class="flex items-center gap-3">
            <img class="w-[90px] h-[90px] object-contain block" src="logo.png" alt="Yaashtech Logo">
            <div class="text-white text-[26px] font-bold tracking-[0.5px]">Yaash<span class="text-[#00dcff]">tech</span></div>
        </div>
        <nav class="flex gap-6 items-center">
            <a href="index.html" class="text-white hover:text-[#00dcff] font-bold text-[15px] tracking-[0.5px] transition-colors">Home</a>
            <a href="laptop_service.html" class="text-white hover:text-[#00dcff] font-bold text-[15px] tracking-[0.5px] transition-colors">Laptop Repair</a>
            <a href="qr_generator.html" class="text-[#00dcff] font-bold text-[15px] tracking-[0.5px] border-b-2 border-[#00dcff] pb-1 transition-colors">QR Generator</a>
            <a href="#" class="text-white font-bold text-[15px] tracking-[0.5px] opacity-40 cursor-not-allowed">Logistics</a>
        </nav>
    </header>

    <div class="max-w-7xl mx-auto mt-10 px-4">
        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            
            <!-- COLUMN 1 & 2: Two-Column Blank Form Field Grid -->
            <div class="xl:col-span-2 bg-zinc-950 rounded-2xl border border-zinc-900 p-6 space-y-6 shadow-xl h-fit">
                <div>
                    <label class="block text-sm font-semibold text-zinc-300 mb-2">Select QR Code Type</label>
                    <select id="qrType" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2.5 shadow-sm focus:ring-2 focus:ring-[#00dcff] focus:border-[#00dcff] transition-all outline-none">
                        <option value="vcard">Save Contact (Multi-Line Column vCard)</option>
                        <option value="whatsapp">Direct WhatsApp Chat Link</option>
                    </select>
                </div>

                <hr class="border-zinc-900">

                <!-- Input elements are loaded empty here -->
                <div id="formFields" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- COLUMN 3: High-Capacity 300x300 Canvas Engine View -->
            <div class="bg-zinc-950 rounded-2xl border border-zinc-900 p-6 flex flex-col items-center justify-center text-center shadow-xl min-h-[480px] h-fit">
                <span class="text-xs font-bold uppercase tracking-wider text-[#00dcff] mb-4">High-Capacity Instant Scan Frame</span>
                
                <div id="qrcode" class="bg-white p-4 rounded-xl shadow-md border border-zinc-200 inline-block"></div>
                
                <div class="mt-6 text-center w-full">
                    <p id="qrStatusLabel" class="text-xs font-medium text-zinc-400 mb-2 uppercase tracking-wide">Data Encoded:</p>
                    <textarea id="rawPayload" readonly class="w-full text-xs font-mono bg-black border border-zinc-900 rounded-md p-2 h-20 resize-none focus:outline-none text-zinc-500"></textarea>
                </div>
                
                <div class="flex gap-3 w-full mt-4">
                    <button id="downloadBtn" class="flex-1 bg-[#00dcff] hover:bg-[#00b2cc] text-black font-bold text-sm py-2.5 px-4 rounded-lg transition-all flex items-center justify-center gap-2 cursor-pointer shadow-md">
                        📥 Download + Border
                    </button>
                    <button id="logRecordBtn" class="bg-zinc-900 hover:bg-zinc-800 text-white border border-zinc-800 font-bold text-sm py-2.5 px-4 rounded-lg transition-all cursor-pointer">
                        💾 Save to History
                    </button>
                </div>
            </div>

            <!-- COLUMN 4: Active History Manager with Dedicated JSON Backup Actions -->
            <div class="bg-zinc-950 rounded-2xl border border-zinc-900 p-6 flex flex-col shadow-xl max-h-[620px] h-fit xl:h-auto">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-white font-bold text-md tracking-wide">📜 Active History Logs</h2>
                    <button id="clearHistoryBtn" class="text-xs text-red-400 hover:text-red-500 font-bold cursor-pointer transition-colors">Clear All</button>
                </div>

                <!-- File Backup/Restore Management Action Buttons -->
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button id="exportDatabaseBtn" class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 font-bold text-xs py-1.5 px-2 rounded-lg transition-all cursor-pointer">
                        📤 Backup Logs
                    </button>
                    <label class="bg-zinc-900 hover:bg-zinc-800 text-zinc-300 border border-zinc-800 font-bold text-xs py-1.5 px-2 rounded-lg transition-all cursor-pointer text-center block">
                        📥 Restore Logs
                        <input type="file" id="importDatabaseFile" class="hidden" accept=".json">
                    </label>
                </div>
                
                <div id="historyLogList" class="space-y-3 overflow-y-auto flex-1 pr-1 text-left">
                    <!-- Javascript appends logged items items here -->
                </div>
            </div>

        </div>
    </div>

    <!-- Link to the separate external database logic file -->
    <script src="qr_engine.js"></script>
</body>
</html>
