<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 15px; }
        .container { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header { border-bottom: 2px solid #17b978; padding-bottom: 10px; margin-bottom: 20px; color: #1e3d59; }
        .grid-input { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #666; text-transform: uppercase; }
        .form-group input { padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; background: #17b978; float: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Party Master Setup Directory</h2>
    </div>

    <div class="grid-input">
        <div class="form-group"><label>Customer / Business Name</label><input type="text" placeholder="Enter Company Name"></div>
        <div class="form-group"><label>GSTIN Registration Number</label><input type="text" placeholder="33AAAAA0000A1Z0"></div>
        <div class="form-group"><label>Primary Contact Phone No</label><input type="text" placeholder="Mobile Number"></div>
        <div class="form-group" style="grid-column: span 3;"><label>Full Registered Office Address</label><input type="text" placeholder="Door No, Street Name, Area, City Pincode"></div>
    </div>
    
    <button class="btn">Register New Profile</button>
    <div style="clear:both;"></div>
</div>

</body>
</html>
