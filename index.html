<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bullet Logistics India Pvt. Ltd. - Portal</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        
        /* Fixed Header & Navigation Menu */
        .navbar { background-color: #1e3d59; display: flex; align-items: center; padding: 0 20px; height: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .navbar-brand { color: #fff; font-weight: bold; font-size: 18px; margin-right: 40px; }
        .nav-menu { display: flex; list-style: none; margin: 0; padding: 0; height: 100%; }
        .nav-item { position: relative; height: 100%; }
        .nav-link { color: #e2e8f0; text-decoration: none; padding: 0 20px; display: flex; align-items: center; height: 100%; font-size: 14px; font-weight: 500; cursor: pointer; }
        .nav-link:hover, .nav-item.active .nav-link { background-color: #17b978; color: #fff; }
        
        /* Dropdown Setup for All Masters Menu */
        .dropdown-content { display: none; position: absolute; top: 50px; left: 0; background-color: #fff; min-width: 220px; box-shadow: 0 4px 8px rgba(0,0,0,0.15); border-radius: 0 0 4px 4px; z-index: 1000; }
        .dropdown-content a { color: #333; padding: 12px 16px; text-decoration: none; display: block; font-size: 13px; border-bottom: 1px solid #f1f5f9; }
        .dropdown-content a:hover { background-color: #f8fafc; color: #0056b3; }
        .nav-item:hover .dropdown-content { display: block; }

        /* Dynamic Main Workspace Frame Container */
        .workspace-frame { width: 100%; height: calc(100vh - 54px); border: none; background: #f4f6f9; }
    </style>
</head>
<body>

<!-- Navigation Bar Menu Components -->
<nav class="navbar">
    <div class="navbar-brand">🚚 Bullet Logistics</div>
    <ul class="nav-menu">
        <!-- Booking Menu -->
        <li class="nav-item active" id="btn-booking">
            <a onclick="loadPage('booking_entry.html', 'btn-booking')" class="nav-link">Booking (GR Entry)</a>
        </li>
        <!-- All Masters Menu Dropdown -->
        <li class="nav-item" id="btn-masters">
            <a class="nav-link">All Masters ▾</a>
            <div class="dropdown-content">
                <a onclick="loadPage('masters_party.html', 'btn-masters')">Party / Customer Master</a>
                <a onclick="loadPage('masters_general.html', 'btn-masters')">Branch & Route Master</a>
                <a onclick="loadPage('masters_general.html', 'btn-masters')">Packing & Charge Configuration</a>
            </div>
        </li>
        <li class="nav-item"><a class="nav-link">Tracking</a></li>
        <li class="nav-item"><a class="nav-link">Reports</a></li>
    </ul>
</nav>

<!-- App Content Display Viewport -->
<iframe id="main-view" class="workspace-frame" src="booking_entry.html"></iframe>

<script>
    // Handles clean menu switching logic
    function loadPage(pageUrl, navId) {
        document.getElementById('main-view').src = pageUrl;
        document.querySelectorAll('.nav-menu li').forEach(li => li.classList.remove('active'));
        document.getElementById(navId).classList.add('active');
    }
</script>

</body>
</html>
