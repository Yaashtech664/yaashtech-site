<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaashtech | Portal Access Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #000000; color: #a0aab2; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col justify-center items-center px-4">

    <div class="w-full max-w-md bg-zinc-950 border border-zinc-900 rounded-2xl p-8 shadow-2xl space-y-6">
        <div class="text-center">
            <img class="w-20 h-20 mx-auto object-contain mb-3" src="logo.png" alt="Yaashtech Logo">
            <h2 class="text-white font-black text-2xl tracking-tight">Internal Portal Gate</h2>
            <p class="text-zinc-500 text-xs mt-1">Authenticate identity credentials to access active master database logs.</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div class="flex flex-col">
                <label class="text-xs font-bold text-zinc-400 mb-1">👤 Administrator Username</label>
                <input type="text" id="username" placeholder="Enter username" required class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#00dcff] transition-all">
            </div>
            <div class="flex flex-col">
                <label class="text-xs font-bold text-zinc-400 mb-1">🔑 Security Access Password</label>
                <input type="password" id="password" placeholder="Enter password" required class="w-full bg-black text-white border border-zinc-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-[#00dcff] transition-all">
            </div>
            <div id="errorMsg" class="text-xs font-bold text-red-400 hidden text-center">❌ Invalid credentials identifier. Try again.</div>
            <button type="submit" class="w-full bg-[#00dcff] hover:bg-[#00b2cc] text-black font-extrabold text-sm py-2.5 px-4 rounded-lg shadow-md transition-colors cursor-pointer">
                Unlock Hub Access
            </button>
        </form>
        
        <div class="text-center">
            <a href="index.html" class="text-xs text-zinc-500 hover:text-white transition-colors">← Abort & Return Home</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Setting standard open-source admin credentials (You can change these inside this file anytime)
            if (user === "admin" && pass === "yaashtech664") {
                localStorage.setItem("yaashtech_session", "authenticated_token_active");
                window.location.href = "dashboard.html"; // Safe redirect to the frame
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
